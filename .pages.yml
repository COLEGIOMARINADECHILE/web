# Configuración del panel de edición Pages CMS (https://pagescms.org)
# Entra a https://app.pagescms.org con tu cuenta de GitHub y abre este repositorio.
media:
  input: public/uploads
  output: /uploads

content:
  # 1. Páginas del sitio
  - name: paginas
    label: "1. Páginas"
    type: collection
    path: src/content/paginas
    filename: "{primary}.md"
    description: "Las páginas del colegio. Para que aparezcan en el menú, agrégalas en «4. Sitio: menú, pie y datos»."
    view:
      primary: titulo
      fields: [titulo]
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: imagen, label: Imagen, type: image, description: "Se usa en el carrusel, en las tarjetas de la portada y al compartir en redes." }
      - { name: resumen, label: Resumen, type: text, description: "Texto corto para el carrusel y para Google." }
      - { name: reune, label: Reunir otras páginas (opcional), type: reference, options: { collection: paginas, search: titulo, value: "{name}", label: "{titulo}", multiple: true }, description: "Muestra estas páginas completas, una tras otra, debajo del contenido. Ej.: Reglamentos y protocolos." }
      - { name: body, label: Contenido, type: rich-text }

  # 2. Portada
  - name: portada
    label: "2. Portada"
    type: file
    path: src/data/portada.json
    description: "Qué se muestra en la portada: carrusel, tarjetas, próxima actividad, agenda y publicaciones de Instagram."
    fields:
      - name: carrusel
        label: Carrusel (en este orden)
        type: object
        list: true
        fields:
          - name: tipo
            label: Qué mostrar
            type: select
            options:
              values:
                - { value: pagina, label: Una página }
                - { value: noticia, label: Una noticia o circular }
          - { name: pagina, label: "Página (si elegiste «Una página»)", type: reference, options: { collection: paginas, search: titulo, value: "{name}", label: "{titulo}" } }
          - { name: noticia, label: "Noticia (si elegiste «Una noticia»)", type: reference, options: { collection: noticias, search: titulo, value: "{name}", label: "{titulo}" } }
      - name: tarjetas
        label: Tarjetas bajo el carrusel (hasta 5, en este orden)
        type: object
        list: true
        fields:
          - name: tipo
            label: Qué mostrar
            type: select
            options:
              values:
                - { value: evento, label: La próxima actividad }
                - { value: noticia, label: Una noticia o circular }
                - { value: pagina, label: Una página }
                - { value: enlace, label: Un enlace (otra página u otro sitio web) }
          - { name: noticia, label: "Noticia (si elegiste «Una noticia»)", type: reference, options: { collection: noticias, search: titulo, value: "{name}", label: "{titulo}" } }
          - { name: pagina, label: "Página (si elegiste «Una página»)", type: reference, options: { collection: paginas, search: titulo, value: "{name}", label: "{titulo}" } }
          - { name: enlace, label: "Dirección (si elegiste «Un enlace»)", type: string, description: "Ej. /noticias/ o https://www.sistemadeadmisionescolar.cl" }
          - { name: titulo, label: Título (opcional), type: string, description: "Para cambiar el texto de la tarjeta. Obligatorio si es un enlace." }
          - { name: imagen, label: Imagen (opcional), type: image, description: "Para cambiar la imagen. Las circulares sin imagen muestran una hoja amarilla con su número." }
      - name: proximaActividad
        label: Próxima actividad (actualizar 1 vez a la semana)
        type: object
        fields:
          - { name: titulo, label: Título, type: string }
          - { name: fecha, label: Fecha, type: date, description: "Si se deja vacía aparece «Fecha por confirmar»." }
          - { name: hora, label: Hora, type: string, description: "Ej. 10:00 hrs." }
          - { name: lugar, label: Lugar, type: string }
          - { name: descripcion, label: Descripción breve, type: text }
          - { name: imagen, label: Imagen, type: image }
          - { name: enlace, label: Enlace (opcional), type: string, description: "Página interna (ej. /licenciatura/) o dirección completa (https://...)." }
      - name: actividades
        label: Esta semana (agenda de actividades)
        type: object
        list: true
        description: "Las actividades con fecha pasada se ocultan solas. Se muestran las 4 siguientes."
        fields:
          - { name: fecha, label: Fecha, type: date, required: true }
          - { name: titulo, label: Actividad, type: string, required: true }
      - name: instagram
        label: Publicaciones de Instagram (Últimas actividades)
        type: string
        list: true
        description: "Copia el enlace de cada publicación (ej. https://www.instagram.com/p/XXXX/). Se mezclan con las noticias por fecha."

  # 3. Noticias y circulares
  - name: noticias
    label: "3. Noticias y circulares"
    type: collection
    path: src/content/noticias
    filename: "{primary}.md"
    view:
      primary: titulo
      fields: [titulo, fecha, categoria]
      sort: [fecha, titulo]
      default:
        sort: fecha
        order: desc
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - { name: fecha, label: Fecha, type: date, required: true }
      - name: categoria
        label: Categoría
        type: select
        default: noticias
        options:
          values:
            - { value: noticias, label: Noticias }
            - { value: informacion, label: Información }
            - { value: circulares, label: Circulares }
      - { name: imagen, label: Imagen principal, type: image, description: "Se muestra en la lista de noticias y, si la eliges, en el carrusel." }
      - { name: documento, label: Documento PDF, type: file, description: "Para circulares: el PDF se muestra en la página con un botón de descarga." }
      - { name: resumen, label: Resumen, type: text, description: "Texto corto para la lista de noticias y el carrusel." }
      - { name: borrador, label: Borrador (no publicar todavía), type: boolean, default: false }
      - { name: body, label: Contenido, type: rich-text }

  # 4. Datos del colegio, menú y pie de página
  - name: sitio
    label: "4. Sitio: menú, pie y datos"
    type: file
    path: src/data/sitio.json
    fields:
      - name: menu
        label: Menú principal
        type: object
        list: true
        description: "La última opción se muestra como botón amarillo (hoy: Admisión)."
        fields:
          - { name: texto, label: Texto, type: string, description: "Si eliges una página y dejas esto vacío, se usa el título de la página." }
          - { name: pagina, label: Página del sitio, type: reference, options: { collection: paginas, search: titulo, value: "{name}", label: "{titulo}" } }
          - { name: enlace, label: "O una dirección (si no es una página)", type: string, description: "Ej. /category/circulares/, /noticias/ o https://... Se usa solo si no eliges una página." }
          - name: submenu
            label: Submenú
            type: object
            list: true
            fields:
              - { name: texto, label: Texto, type: string, description: "Si eliges una página y dejas esto vacío, se usa el título de la página." }
              - { name: pagina, label: Página del sitio, type: reference, options: { collection: paginas, search: titulo, value: "{name}", label: "{titulo}" } }
              - { name: enlace, label: "O una dirección (si no es una página)", type: string, description: "Ej. /category/circulares/, /noticias/ o https://... Se usa solo si no eliges una página." }
      - name: pieInformacion
        label: "Pie de página: Información"
        type: object
        list: true
        fields:
          - { name: texto, label: Texto, type: string, description: "Si eliges una página y dejas esto vacío, se usa el título de la página." }
          - { name: pagina, label: Página del sitio, type: reference, options: { collection: paginas, search: titulo, value: "{name}", label: "{titulo}" } }
          - { name: enlace, label: "O una dirección (si no es una página)", type: string, description: "Ej. /category/circulares/, /noticias/ o https://... Se usa solo si no eliges una página." }
      - name: pieEnlaces
        label: "Pie de página: Enlaces de interés"
        type: object
        list: true
        fields:
          - { name: texto, label: Texto, type: string, description: "Si eliges una página y dejas esto vacío, se usa el título de la página." }
          - { name: pagina, label: Página del sitio, type: reference, options: { collection: paginas, search: titulo, value: "{name}", label: "{titulo}" } }
          - { name: enlace, label: "O una dirección (si no es una página)", type: string, description: "Ej. /category/circulares/, /noticias/ o https://... Se usa solo si no eliges una página." }
      - name: redes
        label: Redes sociales
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string }
          - { name: url, label: Enlace, type: string }
      - { name: nombre, label: Nombre del colegio, type: string }
      - { name: lema, label: Lema, type: string }
      - { name: direccion, label: Dirección, type: string }
      - { name: comuna, label: Comuna o sector, type: string }
      - { name: ciudad, label: Ciudad, type: string }
      - { name: telefono, label: Teléfono, type: string }
      - name: instagram
        label: Instagram oficial
        type: object
        fields:
          - { name: usuario, label: Usuario (sin @), type: string }

  # 5. Enlaces permanentes (atajos)
  - name: redirecciones
    label: "5. Enlaces permanentes"
    type: file
    path: src/data/redirecciones.json
    description: "Direcciones cortas que llevan a otra página. Ej.: atajo «sae» → colegiomarinadechile.cl/sae abre el Sistema de Admisión Escolar. Si el atajo coincide con una página del sitio, el atajo tiene prioridad."
    fields:
      - name: redirecciones
        label: Enlaces
        type: object
        list: true
        fields:
          - { name: atajo, label: "Atajo (lo que va después de colegiomarinadechile.cl/)", type: string, required: true, description: "Solo letras, números y guiones. Ej.: sae, matricula, reunion-apoderados." }
          - { name: destino, label: Lleva a, type: string, required: true, description: "Una página del sitio (ej. /admision/) o una dirección completa (https://...)." }
          - { name: nota, label: Nota interna (opcional), type: string, description: "Para recordar para qué es. No se muestra en el sitio." }
